# What claude-mag reads each week. Edit freely; ids are referenced by picks.
#
# Feeds: any RSS/Atom URL that allows automated readers.
#
# Substack: *.substack.com feeds refuse automated readers from GitHub's servers
# (HTTP 403), and we respect that. Subscribe by email instead (free or paid); a Gmail
# filter labels the emails `claude-mag`, and they arrive with full text. See `gmail`.
# Substacks on their own domain (e.g. astralcodexten.com/feed) may still work as feeds.
# Taste, trust levels and caveats per source live in interests.md.

title_format: "Claude Mag · {year} · Wk {week:02d}"   # Kindle library title; keeps issues sorted together
cover_subtitle: "Tom's Weekly Picks"                  # under the masthead on the cover; blank for none
lookback_days: 8      # how far back each Monday gather looks
max_per_feed: 4       # newest N per feed

sections:
  - id: substack
    title: From Your Substacks
    feeds: []   # all arrive by email; see gmail below

  - id: relationships
    title: Relationships & Psychology
    feeds:
      - name: Greater Good
        url: https://greatergood.berkeley.edu/site/rss/relationships
      - name: The Gottman Institute
        url: https://www.gottman.com/blog/feed/
      - name: The Conversation
        url: https://theconversation.com/uk/topics/relationships-380/articles.atom
      - name: PsyPost
        url: https://www.psypost.org/feed/

  - id: mind
    title: Mind & Ideas
    feeds:
      - name: Psyche
        url: https://psyche.co/feed.rss
      - name: Aeon
        url: https://aeon.co/feed.rss
      - name: Noema
        url: https://www.noemamag.com/feed/
      - name: Big Think
        url: https://bigthink.com/feed/

  - id: science
    title: Science & Nature
    feeds:
      - name: Quanta Magazine
        url: https://www.quantamagazine.org/feed/
      - name: Nautilus
        url: https://nautil.us/feed/
      - name: Undark
        url: https://undark.org/feed/
      - name: Hakai Magazine
        url: https://hakaimagazine.com/feed/
      - name: Works in Progress
        url: https://worksinprogress.co/rss.xml

  - id: tech
    title: AI & Building
    feeds:
      - name: Simon Willison
        url: https://simonwillison.net/atom/everything/
      - name: MIT Technology Review
        url: https://www.technologyreview.com/feed/

  - id: news
    title: Britain & Europe
    feeds:
      - name: Byline Times
        url: https://bylinetimes.com/feed/
      - name: The New World
        url: https://www.thenewworld.co.uk/feed/

  - id: reflection
    title: For Reflection
    feeds: []   # one piece a week, found by Claude (see the mag skill)

# Newsletters by email. A Gmail filter applies this label to them, e.g.
#   from:(substack.com)  ->  apply label "claude-mag"
# The gather/build workflows read the label over IMAP; emails carry the full text,
# paid posts included. Emails go to `section` unless the sender matches a `route` key.
#
# Subscribe by email to (Substacks Tom follows go to `section`):
#   Existential Reflections — danielchechick.substack.com
#   The Write Path — kaguura.substack.com
#   Better Brain — drjuliefratantoni.substack.com
#   The Forbidden Files — ixcarus.substack.com
#   Ground Truths — erictopol.substack.com          (routed to science)
#   Predirections — predirections.substack.com      (routed to science)
#   Climate Ages — climateages.substack.com         (routed to science)
#   Global Nature Beat — thenaturebeat.substack.com (routed to science)
#   Curt Jaimungal — curtjaimungal.substack.com     (routed to mind)
gmail:
  label: claude-mag
  section: substack
  route:          # substring of the sender (name or address) -> section id
    erictopol: science
    predirections: science
    climateages: science
    thenaturebeat: science
    curtjaimungal: mind

# Public-domain texts Claude suggests each week (poems, stories, essays, letters).
classics:
  id: classics
  title: From the Shelf
