name: build-send

# Runs when a picks.yaml lands on main (Claude commits it after you choose),
# or by hand. Builds the EPUB, validates it, emails it to Kindle, and records
# what was sent. Article text exists only on this runner and in the artifact.
on:
  push:
    branches: [main]
    paths: ["issues/*/picks.yaml"]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue id, e.g. 2026-W46"
        required: true
      dry_run:
        description: "Build only; do not email"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mag-main
  cancel-in-progress: false

jobs:
  build-send:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt

      - name: Work out which issue
        id: issue
        env:
          INPUT_ISSUE: ${{ inputs.issue }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_ISSUE" ]; then
            issue="$INPUT_ISSUE"
          else
            issue=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'issues/*/picks.yaml' | sed -E 's#issues/([^/]+)/.*#\1#' | sort | tail -1)
          fi
          [ -n "$issue" ] || { echo "no issue found"; exit 1; }
          echo "id=$issue" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python -m mag build --issue "${{ steps.issue.outputs.id }}" --out out
      - name: Validate EPUB
        run: python -m epubcheck out/*.epub
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mag-${{ steps.issue.outputs.id }}
          path: |
            out/*.epub
            out/build-report.json
          retention-days: 14

      - name: Send to Kindle
        run: >
          python -m mag send --issue "${{ steps.issue.outputs.id }}" --epub out/Claude-Mag-${{ steps.issue.outputs.id }}.epub
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record what was sent
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "claude-mag bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json issues
          git diff --cached --quiet && exit 0
          git commit -m "send: ${{ steps.issue.outputs.id }} delivered to Kindle"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
