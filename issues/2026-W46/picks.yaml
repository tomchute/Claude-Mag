note: |
  The first Claude Mag, with a month of Substacks to catch up on. Two threads run through it. One is honesty: Kyle Harrison on AI that invents its sources, Psyche's policeman who exposes fortune-tellers, and Byline Times taking apart an influence operation. The other is closeness and comparison: Mingming's friends dissecting her love life, Nautilus asking whether envy can be useful, and Seneca on grieving a friend and on wanting friends without needing them.
