note: |
  A quieter week, built around old fears and better rest. Existential Reflections asks why saying no can feel like danger, and Seneca answers from two thousand years away: we suffer more in imagination than in reality. Then sleep, both the research on what matters more than hours and Seneca trying to think above a bathhouse. Further out: Russian novels, the body as a network, how inequality took hold in prehistory, and two reports on who holds power and who pays for it.
