note: |
  A short extra issue on what happens between people, and inside them. Why partners can want each other and still drift apart, what the research says about jealousy turning possessive, and what the founders of well-being research kept coming back to: other people. It ends with a guide to meet slowly, from a Jungian analyst, on the parts of ourselves we would rather not see.
