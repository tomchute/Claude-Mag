note: |
  This week circles what we expect from other people and from ourselves. A therapist on intimacy when needs go unmet and on what we are told we deserve, Kierkegaard on the line between love and obsessive passion, and Seneca on trusting a friend fully and on discontent you cannot travel away from. Around that: other people's highlight reels, moral anger online, and an analyst on children who find their steadiest presence in AI. It ends with two Psyche guides to sit with, on jealousy and on comparing yourself fairly.
